{% extends "base.html" %}
{% block content %}
<h2>發送紀錄（最近 100 筆）</h2>
<div class="table-container">
  <table>
    <tr><th>時間</th><th>Schedule</th><th>Message</th><th>狀態</th><th>錯誤</th></tr>
  {% for l in logs %}
  <tr>
    <td>{{ l.sent_at.strftime("%Y-%m-%d %H:%M:%S") }}</td>
    <td>{{ l.schedule_id }}</td>
    <td>{{ l.message_id or "-" }}</td>
    <td class="{{ 'tag-ok' if l.status.value == 'success' else 'tag-fail' }}">{{ l.status.value }}</td>
    <td>{{ l.error or "" }}</td>
  </tr>
  {% endfor %}
  </table>
</div>
{% endblock %}
